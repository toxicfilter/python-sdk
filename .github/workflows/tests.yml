name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # `requires-python = ">=3.9"`, so 3.9 is part of the promise and gets checked.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']

    name: Python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Nothing to install for the suite itself: the client has no dependencies and the
      # tests drive it through a stub transport, so they need neither the network nor a
      # package index.
      - run: python -m unittest discover -s tests -v

  standards:
    runs-on: ubuntu-latest
    name: PEP 8, PEP 257 and types

    # Once, on the newest version: style and types are the same answer everywhere, and
    # running them five times only makes the log longer.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install ruff mypy

      # PEP 8 and PEP 257, so following them is a check rather than an opinion.
      - run: ruff check .

      # Strict, because the package ships `py.typed`: it tells every consumer's type
      # checker to trust these annotations, so they had better be right.
      - run: mypy toxicfilter/
