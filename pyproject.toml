[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicfilter-sdk"
version = "1.2.2"
description = "The official Python client for the ToxicFilter content moderation API."
readme = "README.md"
authors = [{ name = "Edu Lazaro" }]
requires-python = ">=3.9"
# PEP 639: an SPDX expression and the file it refers to. The old `{ text = ... }` table and
# the licence classifier are deprecated, and setuptools 77 is the first to read this form.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["moderation", "content-moderation", "toxicity", "spam", "api", "client"]

# PyPI shows these and people filter by them. The Python versions listed are the ones the
# CI matrix actually runs, so the promise and the proof are the same list.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# No dependencies, deliberately: a client for one small API is not worth a dependency
# tree, and pinning an HTTP library is how a client gets removed from a project.
dependencies = []

[project.urls]
Homepage = "https://toxicfilter.com"
Documentation = "https://toxicfilter.com/docs/sdks"
Source = "https://github.com/toxicfilter/python-sdk"
Issues = "https://github.com/toxicfilter/python-sdk/issues"

[tool.setuptools.packages.find]
include = ["toxicfilter*"]

# PEP 561. Without this marker shipped inside the package, a type checker ignores every
# annotation in it: the client is fully annotated and consumers would see none of it.
[tool.setuptools.package-data]
toxicfilter = ["py.typed"]

# Ruff, so following PEP 8 and PEP 257 is a check rather than an opinion. The `D` rules
# are pydocstyle: what needs a docstring and what shape it takes.
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "D", "RUF"]
ignore = [
    # A one-line summary on the same line as the quotes is what an accessor wants, and
    # forcing the multi-line shape on thirty of them is noise, not documentation.
    "D200", "D205", "D212",
    # The module docstring of a package's `__init__` is its README's first line; requiring
    # one on every private module as well says nothing.
    "D104",
    # PEP 8 asks for an `Error` suffix on exception names, and these deliberately do not
    # have one: `QuotaExhausted`, `RateLimited`, `InvalidRequest` and `NotFound` are the
    # same names the PHP and JavaScript clients use, and one shape in three languages is
    # a documented decision of this product. Forking the naming per language would cost
    # more than the convention buys.
    "N818",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# A property reads as a value, not as an action, so "Nothing crossed a line" is right
# there and "Return whether nothing crossed a line" is worse. Imperative mood stays
# required for everything that is actually called.
property-decorators = ["property"]

[tool.ruff.lint.per-file-ignores]
# A test's name is its description, so a docstring on each one repeats it. The line limit
# is off here too, and deliberately: what is long in a test is a fixture, and a JSON
# literal wrapped to satisfy a column count is harder to read than the thing it describes.
"tests/*" = ["D100", "D101", "D102", "D103", "D107", "E501"]
# The package docstring is an example, indented so `help(toxicfilter)` shows it as a code
# block. Flattened to satisfy D208 it lost the indentation of its `if` branches and stopped
# being valid Python, which `test_the_package_docstring_is_valid_python` now checks.
"toxicfilter/__init__.py" = ["D208"]

[tool.mypy]
# 3.10 and not the 3.9 of `requires-python`: mypy 2.x refuses to check against 3.9. The
# package still supports it, and what proves that is the CI matrix running the suite there.
python_version = "3.10"
strict = true
warn_unreachable = true
